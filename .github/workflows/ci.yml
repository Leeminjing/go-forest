name: Go
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        module:
          - {path: '.', go: '1.23.x'}
          - {path: 'testkit', go: '1.23.x'}
          - {path: 'extensions/topology', go: '1.23.x'}
          - {path: 'extensions/observe', go: '1.23.x'}
          - {path: 'adapters/gin', go: '1.25.x'}
          - {path: 'extensions/observatory', go: '1.25.x'}
          - {path: 'tests/release-consumer', go: '1.25.x'}
          - {path: 'adapters/grpc', go: '1.25.x'}
          - {path: 'examples/frameworks', go: '1.25.x'}
          - {path: 'adapters/gorm', go: '1.25.x'}
          - {path: 'adapters/nats', go: '1.26.x'}
          - {path: 'extensions/telemetry', go: '1.26.x'}
          - {path: 'examples/ecosystem', go: '1.26.x'}
          - {path: 'adapters/eino', go: '1.23.x'}
          - {path: 'examples/eino', go: '1.23.x'}
          - {path: 'adapters/temporal', go: '1.26.x'}
          - {path: 'examples/temporal', go: '1.26.x'}
          - {path: 'adapters/fx', go: '1.23.x'}
          - {path: 'examples/fx', go: '1.23.x'}
          - {path: 'examples/cross-adapter', go: '1.26.x'}
          - {path: 'examples/temporal-eino', go: '1.26.x'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.module.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.module.go }}
          cache-dependency-path: '**/go.sum'
      - run: go vet ./...
      - run: go test ./... -timeout 60s
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=3 -timeout 90s
      - if: matrix.module.path == '.'
        run: go run ./examples/hello-forest
      - if: matrix.module.path == '.'
        run: go run ./examples/nesting
      - if: matrix.module.path == '.'
        run: go run ./examples/hot-swap
      - if: matrix.module.path == '.'
        run: go run ./examples/web-agent
      - if: matrix.module.path == '.'
        run: go run ./examples/composite
      - if: matrix.module.path == 'examples/fx'
        run: go run ./cmd/demo
      - if: matrix.module.path == 'extensions/topology'
        run: go run ./cmd/demo
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.module.path == '.'
        with:
          name: core-state-machine-${{ matrix.os }}
          path: .scratch/core-state-machine/runs/**
          retention-days: 7
  core-state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOWORK: 'off'
      FOREST_MODEL_PROFILE: extended
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go vet ./tests/internal/topologymodel ./tests/statemachine
      - run: go test -race ./tests/internal/topologymodel ./tests/statemachine -count=3 -timeout=480s -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-state-machine-extended
          path: .scratch/core-state-machine/runs/**
          retention-days: 7
  fx-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-fx-release.py
  cross-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-cross-adapter.py --race --count 3 --published
  testkit-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-testkit-release.py
  topology-incremental:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: python scripts/test-topology-incremental.py --race --count 3
      - if: runner.os == 'Windows'
        run: python scripts/test-topology-incremental.py --compile-only
  topology-v2-published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-topology-v2-release.py
      - run: python scripts/test-topology-incremental.py --published --race --count 3
  topology-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-topology-release.py
  temporal-eino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-temporal-eino.py --race --count 3 --published
  temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-temporal.py --race --count 3 --published
  eino-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-eino-release.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r extensions/observatory/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python extensions/observatory/tests/browser_test.py
        env:
          PYTHONIOENCODING: utf-8
      - run: python examples/frameworks/tests/demo_test.py
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observatory-screenshots
          path: .scratch/v0.*/*.png
  published-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-release.py
  ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r extensions/observatory/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-ecosystem.py --race --count 3 --browser --published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-screenshots
          path: .scratch/ecosystem/*.png
  candidate-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: python scripts/test-candidate-core.py --race --count 3
      - if: runner.os == 'Windows'
        run: python scripts/test-candidate-core.py --count 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-core-${{ matrix.os }}
          path: |
            .scratch/core-performance/*candidate*/metadata.json
            .scratch/core-performance/*candidate*/commands.json
            .scratch/core-performance/*candidate*/core-files.json
            .scratch/core-performance/*candidate*/proof-summary.json
            .scratch/core-performance/*candidate*/go-invocations/*.json
            .scratch/core-performance/*candidate*/*.log
            .scratch/core-performance/*candidate*/COMPLETE
          retention-days: 14
  candidate-services:
    strategy:
      fail-fast: false
      matrix:
        service: [ecosystem, cross-adapter, temporal-eino, temporal, topology]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.service == 'ecosystem'
        run: |
          pip install -r extensions/observatory/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - if: matrix.service == 'ecosystem'
        run: python scripts/test-candidate-core.py --services ecosystem --race --count 3 --browser
      - if: matrix.service != 'ecosystem'
        run: python scripts/test-candidate-core.py --services ${{ matrix.service }} --race --count 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-service-${{ matrix.service }}
          path: |
            .scratch/core-performance/*candidate*/metadata.json
            .scratch/core-performance/*candidate*/commands.json
            .scratch/core-performance/*candidate*/core-files.json
            .scratch/core-performance/*candidate*/proof-summary.json
            .scratch/core-performance/*candidate*/go-invocations/*.json
            .scratch/core-performance/*candidate*/*.log
            .scratch/core-performance/*candidate*/COMPLETE
          retention-days: 14
  candidate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r extensions/observatory/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-candidate-core.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-browser
          path: .scratch/core-performance/*candidate*/*.log
          retention-days: 14
  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/measure-core.py --core-ref HEAD --harness-ref HEAD --label ci-smoke --matrix smoke --count 1 --benchtime 10ms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-smoke
          path: |
            .scratch/core-performance/*ci-smoke/*.json
            .scratch/core-performance/*ci-smoke/*.txt
            .scratch/core-performance/*ci-smoke/COMPLETE
          retention-days: 14
